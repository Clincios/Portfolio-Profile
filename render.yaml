# Render Blueprint — monolith FastAPI (API + static frontend) + Postgres
# Dashboard: New → Blueprint → connect this repo
# Docs: https://render.com/docs/infrastructure-as-code

databases:
  - name: portfolio-db
    plan: free

services:
  - type: web
    name: portfolio-web
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false
